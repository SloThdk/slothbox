name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel previous in-progress runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── TS / Node packages ────────────────────────────────────
  node:
    name: Node ${{ matrix.workspace }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@slothbox/crypto-core"
          - "@slothbox/db"
          - "@slothbox/web"
          - "@slothbox/api-gateway"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          # "20" pulls the latest 20.x. We were pinned to 20.18.3 which
          # tripped eslint-visitor-keys@5.0.1's engines requirement
          # (^20.19.0 || ^22.13.0 || >=24). Floating to 20.x latest keeps
          # us on Node 20 LTS while satisfying transitive deps.
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter ${{ matrix.workspace }} run typecheck

      - name: Lint
        run: pnpm --filter ${{ matrix.workspace }} run lint
        continue-on-error: false

      - name: Test
        run: pnpm --filter ${{ matrix.workspace }} run test
        continue-on-error: false

      - name: Build
        if: matrix.workspace == '@slothbox/web' || matrix.workspace == '@slothbox/api-gateway'
        run: pnpm --filter ${{ matrix.workspace }} run build

  # ─── .NET services ─────────────────────────────────────────
  dotnet:
    name: .NET ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [ingest, receipt]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: services/${{ matrix.service }}
        run: dotnet restore

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: dotnet test --configuration Release --no-build --verbosity normal
        # The two .NET services have no xunit test project yet; `dotnet test`
        # against the app project reports "no test is available" and exits 0, so
        # this step neither gates nor green-washes a real suite. A dedicated
        # SlothBox.Ingest.Tests project (chunk-size arithmetic, base64url decode)
        # is the next CI step — tracked, not pretended-present.
        continue-on-error: true

  # ─── Go services ───────────────────────────────────────────
  go:
    name: Go ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [services/reaper, tools/verify]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build -v ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        # Gating: the reaper carries unit tests (classifyReason + the
        # reapable-state query guard). tools/verify is still a skeleton with no
        # tests — `go test ./...` on a module with no _test.go files exits 0
        # ("no test files"), so a single gating step is correct for both.
        run: go test -race -v ./...

  # ─── Format check ─────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          # See comment in `node` job — float to 20.x latest for engines
          # compat with transitive deps (eslint-visitor-keys@5.0.1+).
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
